<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IP Logger</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <header>
    <div>
      <h1>IP Logger</h1>
      <div class="muted"><span class="dot"></span>visits on this box</div>
    </div>
    <div class="muted" id="status">Loading…</div>
  </header>

  <section class="stats">
    <div class="stat">Total hits<b id="total">—</b></div>
    <div class="stat">Unique IPs<b id="unique">—</b></div>
    <div class="stat">Countries<b id="countries">—</b></div>
    <div class="stat">Last seen<b id="last">—</b></div>
  </section>

  <section class="viz">
    <div class="map-panel">
      <div class="map-wrap">
        <div id="map"></div>
      </div>
      <div class="map-caption">
        <span id="map-caption">Loading map…</span>
        <span class="map-legend">
          <span><i class="lg lg-point"></i>Exact</span>
          <span><i class="lg lg-country"></i>Country</span>
        </span>
      </div>
    </div>
    <div class="countries-panel">
      <div class="panel-label">Top countries</div>
      <div id="country-bars" class="muted">No country data yet</div>
    </div>
  </section>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Filter IP, city, country, org, user agent">
    <span class="chip" id="country-chip">
      <span id="country-chip-label"></span>
      <button id="country-chip-clear" type="button" aria-label="Clear country filter">×</button>
    </span>
    <button id="refresh" type="button">Refresh</button>
  </div>

  <div class="wrap">
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>IP</th>
          <th>Location</th>
          <th>Org</th>
          <th>User agent</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td class="empty" colspan="5">No visits yet</td></tr>
      </tbody>
    </table>
    <div class="pager">
      <div class="pager-info" id="pager-info"></div>
      <div class="pager-controls">
        <button id="page-prev" type="button">Previous</button>
        <span id="page-status" class="muted">Page 1 of 1</span>
        <button id="page-next" type="button">Next</button>
        <label class="page-size">Per page
          <select id="page-size">
            <option value="10">10</option>
            <option value="30" selected>30</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </label>
      </div>
    </div>
  </div>

  <dialog id="sheet">
    <div class="sheet-head">
      <strong>Visit detail</strong>
      <button id="close" type="button">Close</button>
    </div>
    <pre id="payload">{}</pre>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    const rowsEl = document.getElementById("rows");
    const searchEl = document.getElementById("search");
    const statusEl = document.getElementById("status");
    const sheet = document.getElementById("sheet");
    const payloadEl = document.getElementById("payload");
    const mapCaptionEl = document.getElementById("map-caption");
    const countryBarsEl = document.getElementById("country-bars");
    const countryChip = document.getElementById("country-chip");
    const countryChipLabel = document.getElementById("country-chip-label");
    const pagerInfoEl = document.getElementById("pager-info");
    const pageStatusEl = document.getElementById("page-status");
    const pagePrevEl = document.getElementById("page-prev");
    const pageNextEl = document.getElementById("page-next");
    const pageSizeEl = document.getElementById("page-size");
    const PAGE_SIZE_MAX = 100;
    let timer = null;
    let countryFilter = "";
    let countryFilterName = "";
    let lastFitKey = null;
    let map = null;
    let clusters = null;
    let page = 1;
    let pageSize = 30;

    document.getElementById("refresh").addEventListener("click", load);
    document.getElementById("close").addEventListener("click", () => sheet.close());
    document.getElementById("country-chip-clear").addEventListener("click", () => {
      setCountryFilter("", "");
      page = 1;
      load();
    });
    searchEl.addEventListener("input", debounce(() => {
      page = 1;
      load();
    }, 250));
    rowsEl.addEventListener("click", (event) => {
      const row = event.target.closest("tr[data-id]");
      if (row) openVisit(row.dataset.id);
    });
    countryBarsEl.addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-country]");
      if (!btn) return;
      const code = btn.dataset.country;
      if (countryFilter === code) setCountryFilter("", "");
      else setCountryFilter(code, btn.dataset.name || code);
      page = 1;
      load();
    });
    pagePrevEl.addEventListener("click", () => {
      if (page <= 1) return;
      page -= 1;
      load();
    });
    pageNextEl.addEventListener("click", () => {
      page += 1;
      load();
    });
    pageSizeEl.addEventListener("change", () => {
      pageSize = clampPageSize(pageSizeEl.value);
      pageSizeEl.value = String(pageSize);
      page = 1;
      load();
    });

    function setCountryFilter(code, name) {
      countryFilter = code;
      countryFilterName = name;
      if (code) {
        countryChipLabel.textContent = name + " (" + code + ")";
        countryChip.classList.add("visible");
      } else {
        countryChip.classList.remove("visible");
      }
    }

    function initMap() {
      if (typeof L === "undefined") {
        mapCaptionEl.textContent = "Map library failed to load";
        return;
      }
      map = L.map("map", {
        scrollWheelZoom: true,
        worldCopyJump: true,
        attributionControl: true
      }).setView([20, 0], 2);
      L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
        attribution: "&copy; <a href=\"https://www.openstreetmap.org/copyright\">OSM</a> &copy; <a href=\"https://carto.com/attributions\">CARTO</a>",
        subdomains: "abcd",
        maxZoom: 18
      }).addTo(map);
      clusters = L.markerClusterGroup({
        showCoverageOnHover: false,
        maxClusterRadius: 48,
        spiderfyOnMaxZoom: true,
        iconCreateFunction(cluster) {
          const n = cluster.getChildCount();
          const size = n < 10 ? 32 : n < 50 ? 40 : 48;
          return L.divIcon({
            html: "<div>" + n + "</div>",
            className: "hit-cluster",
            iconSize: [size, size]
          });
        }
      });
      map.addLayer(clusters);
      requestAnimationFrame(() => map.invalidateSize());
    }

    function clampPageSize(value) {
      const n = Number.parseInt(String(value ?? ""), 10);
      if (!Number.isFinite(n)) return 30;
      return Math.min(PAGE_SIZE_MAX, Math.max(1, n));
    }

    function filterParams() {
      const params = new URLSearchParams();
      const q = searchEl.value.trim();
      if (q) params.set("q", q);
      if (countryFilter) params.set("country", countryFilter);
      return params;
    }

    function visitsQuery() {
      const params = filterParams();
      params.set("limit", String(pageSize));
      params.set("offset", String((page - 1) * pageSize));
      return "?" + params.toString();
    }

    function locationsQuery() {
      const params = filterParams();
      params.set("limit", "2000");
      return "?" + params.toString();
    }

    async function load() {
      try {
        const [statsRes, visitsRes, locRes] = await Promise.all([
          fetch("/api/stats"),
          fetch("/api/visits" + visitsQuery()),
          fetch("/api/locations" + locationsQuery())
        ]);
        if (statsRes.status === 401 || visitsRes.status === 401 || locRes.status === 401) {
          statusEl.textContent = "Authentication required";
          return;
        }
        if (!statsRes.ok || !visitsRes.ok || !locRes.ok) {
          throw new Error("Request failed");
        }
        const stats = await statsRes.json();
        const body = await visitsRes.json();
        const locations = await locRes.json();
        const maxPage = Math.max(1, Math.ceil((body.total || 0) / pageSize));
        if (page > maxPage) {
          page = maxPage;
          return load();
        }
        document.getElementById("total").textContent = stats.total;
        document.getElementById("unique").textContent = stats.uniqueIps;
        document.getElementById("countries").textContent = stats.countries;
        document.getElementById("last").textContent = formatTime(stats.lastSeen);
        renderRows(body.visits);
        renderPager(body.total || 0, maxPage);
        renderCountries(locations.byCountry);
        renderMap(locations);
        statusEl.textContent = "Updated " + new Date().toLocaleTimeString();
      } catch (err) {
        statusEl.textContent = "Failed to load visits";
      }
    }

    function renderMap(locations) {
      const points = locations.points || [];
      if (!map || !clusters) {
        mapCaptionEl.textContent = "Map library failed to load";
        return;
      }
      clusters.clearLayers();
      for (const point of points) {
        const isPoint = point.precision === "point";
        const marker = L.circleMarker([point.lat, point.lng], {
          radius: isPoint ? 7 : 6,
          color: isPoint ? "#6cb6ff" : "#8b9aab",
          weight: 1,
          fillColor: isPoint ? "#6cb6ff" : "#8b9aab",
          fillOpacity: isPoint ? 0.9 : 0.55
        });
        const place = [point.city, point.region, point.country].filter(Boolean).join(", ") || "Unknown";
        marker.bindTooltip(escapeHtml(place) + "<br>" + escapeHtml(point.ip || "—"), {
          direction: "top",
          opacity: 0.95
        });
        marker.on("click", () => openVisit(point.id));
        clusters.addLayer(marker);
      }

      const shown = points.length;
      const plottable = locations.plottable || 0;
      const parts = [];
      if (!shown) {
        parts.push("No located visits yet");
      } else {
        parts.push(shown + (shown === 1 ? " visit" : " visits") + " on the map");
        if (locations.precise) parts.push(locations.precise + " exact");
        if (locations.countryLevel) parts.push(locations.countryLevel + " country-level");
        if (plottable > shown) parts.push("latest " + shown + " of " + plottable);
      }
      mapCaptionEl.textContent = parts.join(" · ");

      const fitKey = [searchEl.value, countryFilter, shown].join("|");
      if (fitKey === lastFitKey) return;
      lastFitKey = fitKey;
      if (!shown) {
        map.setView([20, 0], 2);
        return;
      }
      if (shown === 1) {
        const p = points[0];
        map.setView([p.lat, p.lng], p.precision === "point" ? 8 : 4);
        return;
      }
      const bounds = L.latLngBounds(points.map((p) => [p.lat, p.lng]));
      map.fitBounds(bounds.pad(0.18), { maxZoom: 6, animate: false });
    }

    function renderCountries(rows) {
      if (!rows || !rows.length) {
        countryBarsEl.className = "muted";
        countryBarsEl.textContent = "No country data yet";
        return;
      }
      countryBarsEl.className = "";
      const max = rows[0].count || 1;
      countryBarsEl.innerHTML = rows.map((row) => {
        const width = Math.max(6, Math.round((row.count / max) * 100));
        const active = countryFilter === row.country ? " active" : "";
        return `
          <button type="button" class="country-row${active}" data-country="${escapeAttr(row.country)}" data-name="${escapeAttr(row.name)}">
            <span class="country-name">${escapeHtml(row.name)}</span>
            <span class="country-count">${escapeHtml(row.count)}</span>
            <span class="country-track"><span class="country-bar" style="width:${width}%"></span></span>
          </button>
        `;
      }).join("");
    }

    function renderPager(total, maxPage) {
      const from = total === 0 ? 0 : (page - 1) * pageSize + 1;
      const to = Math.min(page * pageSize, total);
      pagerInfoEl.textContent = total === 0
        ? "No visits"
        : "Showing " + from + "–" + to + " of " + total;
      pageStatusEl.textContent = "Page " + page + " of " + maxPage;
      pagePrevEl.disabled = page <= 1;
      pageNextEl.disabled = page >= maxPage || total === 0;
    }

    function renderRows(visits) {
      if (!visits.length) {
        rowsEl.innerHTML = '<tr><td class="empty" colspan="5">No visits yet</td></tr>';
        return;
      }
      rowsEl.innerHTML = visits.map((visit) => {
        const location = [visit.city, visit.region, visit.country].filter(Boolean).join(", ") || "—";
        return `
          <tr data-id="${escapeAttr(visit.id)}">
            <td>${escapeHtml(formatTime(visit.created_at))}</td>
            <td>${escapeHtml(visit.ip || "—")}</td>
            <td>${escapeHtml(location)}</td>
            <td class="clip">${escapeHtml(visit.as_organization || "—")}</td>
            <td class="clip">${escapeHtml(visit.user_agent || "—")}</td>
          </tr>
        `;
      }).join("");
    }

    async function openVisit(id) {
      const res = await fetch("/api/visits/" + id);
      if (!res.ok) return;
      const data = await res.json();
      payloadEl.textContent = JSON.stringify(data.payload ?? data, null, 2);
      sheet.showModal();
    }

    function formatTime(value) {
      if (!value) return "—";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString();
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function escapeAttr(value) {
      return String(value).replaceAll('"', "");
    }

    function debounce(fn, wait) {
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), wait);
      };
    }

    initMap();
    load();
    setInterval(load, 10000);
  </script>
</body>
</html>
