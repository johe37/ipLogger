<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nice IP you've got there</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2129;
      --line: #2a3440;
      --text: #e7ecf1;
      --muted: #8b9aab;
      --good: #3dd68c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font: 16px/1.45 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    main {
      width: min(720px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
    }

    .frame {
      overflow: hidden;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: peek 4s ease-in-out infinite;
    }

    @keyframes peek {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.06) translateY(-1.5%); }
    }

    .copy { padding: 18px 20px 20px; }

    h1 {
      margin: 0 0 6px;
      font-size: 22px;
    }

    p { margin: 0; color: var(--muted); }

    .ok {
      display: inline-block;
      margin-top: 12px;
      color: var(--good);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <div class="frame">
      <img src="/health-raccoon.jpg" alt="A raccoon in a hoodie at a homelab terminal, definitely logging your IP">
    </div>
    <div class="copy">
      <h1>nice IP you've got there</h1>
      <p>IP Logger is running. The intern already wrote it down.</p>
      <span class="ok">200 OK · health check</span>
    </div>
  </main>
</body>
</html>
