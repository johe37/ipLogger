volumes:
  data:
services:
  iplogger:
    build: .
    image: iplogger:local
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DASHBOARD_USER: ${DASHBOARD_USER:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
      DATABASE_PATH: /data/visits.db
    volumes:
      - data:/data
